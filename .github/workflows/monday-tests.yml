name: Monday UI + API Tests

on:
  # Gate del PR: smoke (API + UI Chromium). La regresión multi-browser queda para el cron.
  pull_request:
    branches: [main]
  schedule:
    # Lunes 15:00 ART (GMT-3) = 18:00 UTC — siempre contra prod live, suite full
    - cron: '0 18 * * 1'
  workflow_dispatch:
    inputs:
      test_env:
        description: Ambiente a ejecutar (prod live hoy; qa/dev requieren secrets)
        type: choice
        options:
          - prod
          - qa
          - dev
        default: prod
      suite:
        description: smoke = @smoke (rápido); full = regresión multi-browser
        type: choice
        options:
          - smoke
          - full
        default: full

concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  config:
    name: Config — resolve ${{ matrix.test_env }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test_env: [prod, qa, dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate environment resolution
        run: npx playwright test --project=config
        env:
          CI: true
          TEST_ENV: ${{ matrix.test_env }}

  api:
    name: API ${{ github.event.inputs.suite || (github.event_name == 'pull_request' && 'smoke' || 'full') }} (${{ github.event.inputs.test_env || 'prod' }})
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      TEST_ENV: ${{ github.event.inputs.test_env || 'prod' }}
      SUITE: ${{ github.event.inputs.suite || (github.event_name == 'pull_request' && 'smoke' || 'full') }}
      UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      QA_UI_BASE_URL: ${{ secrets.QA_UI_BASE_URL }}
      QA_API_BASE_URL: ${{ secrets.QA_API_BASE_URL }}
      DEV_UI_BASE_URL: ${{ secrets.DEV_UI_BASE_URL }}
      DEV_API_BASE_URL: ${{ secrets.DEV_API_BASE_URL }}
      API_MAX_RESPONSE_MS: '5000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright Chromium (API request context)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (browser from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run API tests (smoke)
        if: env.SUITE == 'smoke'
        run: npx playwright test --project=api --grep @smoke

      - name: Run API tests (full)
        if: env.SUITE != 'smoke'
        run: npx playwright test --project=api

      - name: Upload API happy-path JSON + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-artifacts-${{ env.TEST_ENV }}-${{ env.SUITE }}
          path: |
            api-responses/
            api-evidence/
            playwright-report/
            test-results/
            allure-results/
          if-no-files-found: warn

  ui:
    name: UI — ${{ matrix.project }} ${{ github.event.inputs.suite || (github.event_name == 'pull_request' && 'smoke' || 'full') }} (${{ github.event.inputs.test_env || 'prod' }})
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: ui-chromium
            browser: chromium
            suites: 'smoke,full'
          - project: ui-firefox
            browser: firefox
            suites: 'full'
          - project: ui-webkit
            browser: webkit
            suites: 'full'
          - project: ui-mobile-chromium
            browser: chromium
            suites: 'full'
    env:
      CI: true
      TEST_ENV: ${{ github.event.inputs.test_env || 'prod' }}
      SUITE: ${{ github.event.inputs.suite || (github.event_name == 'pull_request' && 'smoke' || 'full') }}
      UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      QA_UI_BASE_URL: ${{ secrets.QA_UI_BASE_URL }}
      QA_API_BASE_URL: ${{ secrets.QA_API_BASE_URL }}
      DEV_UI_BASE_URL: ${{ secrets.DEV_UI_BASE_URL }}
      DEV_API_BASE_URL: ${{ secrets.DEV_API_BASE_URL }}
    steps:
      - name: Decide if this browser runs for the suite
        id: gate
        run: |
          if echo "${{ matrix.suites }}" | grep -qw "${{ env.SUITE }}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Resolve Playwright version
        if: steps.gate.outputs.run == 'true'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.gate.outputs.run == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser
        if: steps.gate.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright OS deps (browser from cache)
        if: steps.gate.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run UI tests (smoke)
        if: steps.gate.outputs.run == 'true' && env.SUITE == 'smoke'
        run: npx playwright test --project=${{ matrix.project }} --grep @smoke

      - name: Run UI tests (full)
        if: steps.gate.outputs.run == 'true' && env.SUITE != 'smoke'
        run: npx playwright test --project=${{ matrix.project }}

      - name: Skip (browser not in suite)
        if: steps.gate.outputs.run != 'true'
        run: echo "Skipping ${{ matrix.project }} for suite=${{ env.SUITE }}"

      - name: Upload UI report + Allure results
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-${{ matrix.project }}-${{ env.TEST_ENV }}-${{ env.SUITE }}
          path: |
            allure-results/
            playwright-report/
            test-results/
          if-no-files-found: warn
