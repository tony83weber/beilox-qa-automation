          - heading [level=3] [ref=e411]:
            - link "¿Cómo comprar pasajes en micro online?" [ref=e412] [cursor=pointer]:
              - /url: /ayuda/como-comprar-en-central-de-pasajes/como-comprar-pasajes-micro-online
          - paragraph [ref=e413]: Centraldepasajes.com es la plataforma de pasajes en micro líder, donde podés comprar online de forma rápida, fácil y segura. Solo ingresá el origen, destino, fecha de viaje, cantidad de pasajeros y presioná "Buscar". Compará entre empresas, horarios y precios, seleccionando lo que más te convenga. Elegí tu asiento, completá los datos de los pasajeros y el medio de pago. Finalizá la compra y recibí tu eticket por email, listo para subir al bus. ¡Viajar nunca fue tan sencillo!
        - generic [ref=e414]:
          - heading [level=3] [ref=e415]:
            - link "¿Cómo devolver pasajes en micro?" [ref=e416] [cursor=pointer]:
              - /url: /ayuda/devolucion-de-pasajes
          - paragraph [ref=e417]: Devolver tus pasajes en Centraldepasajes.com es muy simple. Ingresá a "Devolver mi pasaje", completá la información y presioná "Buscar". Verificá que la información del pasaje sea correcta, hacé clic en "Devolver" y ¡listo! Si usaste la APP, ingresá a "Mis viajes", seleccioná el pasaje y presioná "Devolver". También podés solicitar la devolución por email; deberás hacerlo con anticipación para cumplir con los plazos del viaje. ¡Así de rápido y fácil!
